<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Neon Metropolis | High-Speed Gateway</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #030705;
      color: #10b981;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Courier New', monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      overflow: hidden;
      user-select: none;
    }

    /* Splash Screen Overlay */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: #030705;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      overflow: hidden;
      user-select: none;
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Ambient Bioluminescent Background Glow */
    .bg-glow {
      position: absolute;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, rgba(3, 7, 5, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      pointer-events: none;
      animation: pulseGlow 3s ease-in-out infinite alternate;
    }
    @keyframes pulseGlow {
      0% { opacity: 0.6; transform: translate(-50%, -50%) scale(0.9); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
    }

    /* Glowing Core Orb */
    .core-container {
      position: relative;
      width: 88px;
      height: 88px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .core-ring {
      position: absolute;
      inset: 0;
      border: 3px solid rgba(16, 185, 129, 0.2);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.8s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
    }
    .core-inner {
      font-size: 38px;
      animation: bounce 1.8s ease-in-out infinite;
      filter: drop-shadow(0 0 12px rgba(16, 185, 129, 0.8));
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    /* Branding Typography */
    h1 {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #ffffff;
      text-transform: uppercase;
      margin-bottom: 4px;
      text-shadow: 0 0 15px rgba(16, 185, 129, 0.5);
    }
    .tagline {
      font-size: 11px;
      letter-spacing: 3px;
      color: #34d399;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 28px;
      opacity: 0.85;
    }

    /* Progress Bar */
    .progress-box {
      width: 100%;
      max-width: 280px;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 12px;
      padding: 3px;
      margin-bottom: 14px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5), inset 0 0 10px rgba(16, 185, 129, 0.05);
    }
    .progress-fill {
      height: 7px;
      background: linear-gradient(90deg, #059669, #10b981, #34d399);
      border-radius: 8px;
      width: 35%;
      transition: width 0.2s ease-out;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.7);
    }

    /* Status Readout */
    .status-text {
      font-size: 11px;
      font-family: 'Courier New', monospace;
      color: #a7f3d0;
      letter-spacing: 0.5px;
      min-height: 18px;
    }
    .telemetry {
      margin-top: 18px;
      font-size: 10px;
      color: #065f46;
      font-family: 'Courier New', monospace;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Fullscreen Game App Frame (Permanent Evergreen Shell) */
    #game-frame {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      margin: 0;
      padding: 0;
      z-index: 10;
      background: #030705;
      display: block;
    }
  </style>
</head>
<body>
  <!-- Fullscreen Game App Frame (Player stays on pocomon9.github.io/green-status/ permanently) -->
  <iframe id="game-frame" src="about:blank" allow="clipboard-read; clipboard-write; autoplay; fullscreen"></iframe>

  <!-- Seamless Instant Splash / Preload Screen -->
  <div id="splash">
    <div class="bg-glow"></div>

    <div class="core-container">
      <div class="core-ring"></div>
      <div class="core-inner">🌿</div>
    </div>

    <h1>NEON METROPOLIS</h1>
    <div class="tagline">Underworld RPG Mesh</div>

    <div class="progress-box">
      <div id="p-bar" class="progress-fill"></div>
    </div>

    <div id="status" class="status-text">> Uplinking Quantum Network...</div>
    <div class="telemetry">⚡ Evergreen Cluster Protocol v2.3</div>
  </div>

  <script>
    // Expand Telegram WebApp immediately
    if (window.Telegram && window.Telegram.WebApp) {
      try {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
      } catch(e) {}
    }

    const CANDIDATES = [
      "https://generations-submission-xml-socks.trycloudflare.com",
      "https://camcorder-cho-handmade-motivated.trycloudflare.com",
      "https://waiver-routers-folding-standards.trycloudflare.com"
    ];

    const STATUS_FEEDS = [
      "https://raw.githubusercontent.com/pocomon9/green/main/status.json",
      "https://raw.githubusercontent.com/sifihub/green/main/status.json",
      "https://raw.githubusercontent.com/analyse99km/green/main/status.json"
    ];

    const bar = document.getElementById('p-bar');
    const statusText = document.getElementById('status');
    const splash = document.getElementById('splash');
    const frame = document.getElementById('game-frame');

    function setProgress(pct, text) {
      if (bar) bar.style.width = pct + '%';
      if (statusText && text) statusText.textContent = text;
    }

    function buildGameUrl(baseUrl) {
      const params = new URLSearchParams(window.location.search);
      try {
        const saved = localStorage.getItem('metropolis_auth_user');
        if (saved) {
          const u = JSON.parse(saved);
          if (u.email && !params.has('userEmail')) params.set('userEmail', u.email);
          if (u.name && !params.has('userName')) params.set('userName', u.name);
          if (u.isTelegram) params.set('isTelegram', '1');
        }
      } catch(e) {}

      if (window.Telegram && window.Telegram.WebApp) {
        const tg = window.Telegram.WebApp;
        if (tg.initDataUnsafe && tg.initDataUnsafe.user && !params.has('tgUser')) {
          params.set('tgUser', JSON.stringify(tg.initDataUnsafe.user));
        }
        if (tg.initDataUnsafe && tg.initDataUnsafe.start_param && !params.has('ref')) {
          params.set('ref', tg.initDataUnsafe.start_param);
        }
      }
      const sep = baseUrl.includes('?') ? '&' : '?';
      const q = params.toString();
      return q ? `${baseUrl}${sep}${q}` : baseUrl;
    }

    // Dismiss splash instantly when game frame loads
    let splashDismissed = false;
    function dismissSplash() {
      if (splashDismissed) return;
      splashDismissed = true;
      setProgress(100, '> Quantum Uplink Active! Entering City...');
      setTimeout(() => {
        if (splash) {
          splash.style.opacity = '0';
          setTimeout(() => splash.style.display = 'none', 400);
        }
      }, 80);
    }

    frame.addEventListener('load', () => {
      if (frame.src && frame.src !== 'about:blank') {
        dismissSplash();
      }
    });

    // Cross-origin session sync: listen for session save events from game
    window.addEventListener('message', (ev) => {
      if (ev.data && ev.data.type === 'METROPOLIS_SESSION_SAVE' && ev.data.user) {
        try {
          localStorage.setItem('metropolis_auth_user', JSON.stringify(ev.data.user));
        } catch(err) {}
      }
    });

    async function ping(url, timeoutMs = 800) {
      if (!url || !url.startsWith('https://')) return null;
      try {
        const ctrl = new AbortController();
        const tid = setTimeout(() => ctrl.abort(), timeoutMs);
        const res = await fetch(url + '/api/health', { signal: ctrl.signal });
        clearTimeout(tid);
        if (res.ok) return url;
      } catch(e) {}
      return null;
    }

    async function mountGame(runnerUrl) {
      try { localStorage.setItem('neon_fast_url', runnerUrl); } catch(e) {}
      const targetUrl = buildGameUrl(runnerUrl);
      if (frame.src !== targetUrl) {
        frame.src = targetUrl;
      }
    }

    async function initEvergreenApp() {
      // 1. INSTANT PRELOAD: Immediately mount cached or primary runner in 0ms!
      const initialNode = localStorage.getItem('neon_fast_url') || CANDIDATES[0];
      mountGame(initialNode);
      setProgress(60, '> Syncing Underworld Syndicate...');

      // Max 2.5s safeguard: dismiss splash regardless so player is never stuck
      setTimeout(dismissSplash, 2500);

      // 2. Parallel background verification of initial node
      const isAlive = await ping(initialNode, 700);
      if (isAlive) {
        setProgress(95, '> Connected to High-Speed Node...');
        return;
      }

      // 3. Fallback: Rapid race of secondary candidates
      setProgress(75, '> Re-routing to redundant cluster runner...');
      const candidatePings = CANDIDATES.filter(u => u !== initialNode).map(u => ping(u, 900));
      const results = await Promise.all(candidatePings);
      const alive = results.find(Boolean);
      if (alive) {
        mountGame(alive);
        return;
      }

      // 4. Fallback: Query live status feeds in parallel
      const feedPromises = STATUS_FEEDS.map(async (feed) => {
        try {
          const res = await fetch(feed + '?t=' + Date.now());
          if (res.ok) {
            const data = await res.json();
            if (data && data.url) {
              const live = await ping(data.url, 1000);
              if (live) return live;
            }
          }
        } catch(e) {}
        return null;
      });

      const feedResults = await Promise.all(feedPromises);
      const fallbackAlive = feedResults.find(Boolean);
      if (fallbackAlive) {
        mountGame(fallbackAlive);
      }
    }

    initEvergreenApp();
  </script>
</body>
</html>
